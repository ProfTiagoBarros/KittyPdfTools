[package]
name = "tauri-plugin-saf-save"
version = "0.1.0"
edition = "2021"
description = "Grava um arquivo num destino escolhido pelo seletor do Android, pelo canal que atualiza os metadados do documento."
license = "UNLICENSED"
links = "tauri-plugin-saf-save"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
